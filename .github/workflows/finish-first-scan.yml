name: Finish FIRST photogrammetry model
on:
  push:
    paths:
      - "scripts/project-sources/finish_first_scan.py"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  finish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install model processing packages
        run: python -m pip install numpy scipy pillow opencv-python-headless trimesh
      - name: Refine scanned geometry and build real underside
        run: python scripts/project-sources/finish_first_scan.py
      - name: Commit corrected GLB
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/assets/first/FIRST_THINGS_FIRST_SCANSIONE_LISCIA_V2.glb
          if ! git diff --cached --quiet; then
            git commit -m "Repair FIRST scan underside and smooth clay surface"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
