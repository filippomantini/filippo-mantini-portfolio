name: Optimize photography

on:
  workflow_dispatch:
  push:
    paths:
      - "public/assets/photography/events/**"
      - "public/assets/photography/street/**"
      - "public/assets/photography/fashion/**"
      - "public/assets/photography/personal/**"
      - "scripts/optimize_photography.py"

permissions:
  contents: write

jobs:
  optimize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install image tools
        run: python -m pip install --upgrade pillow

      - name: Optimize photography
        run: python scripts/optimize_photography.py

      - name: Commit generated images
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/assets/photography/optimized public/assets/photography/manifest.json
          if git diff --cached --quiet; then
            echo "No optimized image changes."
          else
            git commit -m "Optimize photography assets"
            git push
          fi
