name: Optimize photography

on:
  workflow_dispatch:
  push:
    paths:
      - "public/assets/photography/events/**"
      - "public/assets/photography/street/**"
      - "public/assets/photography/fashion/**"
      - "public/assets/photography/personal/**"
      - "scripts/optimize_photography.py"
      - "scripts/optimize_delivery.py"
      - "scripts/optimize_video.py"
      - "scripts/check_video_playback.cjs"
      - "scripts/check_type_specimen.cjs"
      - "scripts/check_first_viewer.cjs"
      - "public/assets/first-viewer.js"
      - "public/assets/new-case-studies.css"
      - "public/assets/first/*.glb"
      - "public/assets/type-specimen.js"
      - "public/assets/type-specimen.css"
      - "public/assets/type/**"
      - "public/assets/video-playback.js"
      - "public/assets/collapse-ss26.css"
      - "scripts/check_delivery.py"
      - "scripts/check_gallery_layout.cjs"
      - "public/assets/photography-gallery-v2.js"
      - "public/assets/photography-static.css"
      - ".github/workflows/optimize-photography.yml"
      - "public/assets/about-desk.jpg"
      - "public/assets/filippo-mantini-illustration.jpg"
      - "public/assets/citta-di-castello-hero.jpg"

permissions:
  contents: write

jobs:
  optimize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install image tools
        run: |
          python -m pip install --upgrade pillow fonttools brotli
          if ! command -v ffmpeg >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y ffmpeg
          fi

      - name: Optimize photography
        run: python scripts/optimize_photography.py

      - name: Build responsive pages and local fonts
        run: python scripts/optimize_delivery.py

      - name: Verify gallery completeness and delivery assets
        run: |
          python scripts/check_delivery.py
          node scripts/check_gallery_layout.cjs
          node scripts/check_video_playback.cjs
          node scripts/check_type_specimen.cjs
          node scripts/check_first_viewer.cjs

      - name: Commit generated images
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public
          if git diff --cached --quiet; then
            echo "No optimized image changes."
          else
            git commit -m "Build responsive portfolio pages and cached delivery assets"
            git push
          fi
