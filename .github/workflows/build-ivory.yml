name: Build Ivory case study

on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/build_ivory.py'
      - 'public/assets/ivory/**'
      - '!public/assets/ivory/web/**'
      - '.github/workflows/build-ivory.yml'

permissions:
  contents: write

concurrency:
  group: build-ivory
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install media tools
        run: python -m pip install --only-binary=:all: Pillow PyMuPDF==1.26.6 imageio-ffmpeg==0.6.0
      - name: Build responsive images, compressed videos and both languages
        run: python scripts/build_ivory.py
      - name: Publish the complete case study
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/assets/ivory/web public/work/ivory/index.html public/it/work/ivory/index.html
          if ! git diff --cached --quiet; then
            git commit -m 'Build Ivory case study with optimized campaign and event media'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
